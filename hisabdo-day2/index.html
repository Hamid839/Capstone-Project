<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management | Day 2 - HisabDo Internship</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🎓 Student Management System</h1>
    <p>Day 2 Task — HisabDo MERN Internship (Plain HTML, CSS & JavaScript)</p>
  </header>

  <main>
    <!-- Add Student Form -->
    <section class="card">
      <h2>Add New Student</h2>
      <form id="student-form">
        <div class="form-row">
          <input type="text" id="name" placeholder="Full Name" required />
          <input type="email" id="email" placeholder="Email Address" required />
        </div>
        <div class="form-row">
          <input type="text" id="course" placeholder="Course" required />
          <input type="number" id="marks" placeholder="Marks (0-100)" min="0" max="100" required />
        </div>
        <button type="submit">➕ Add Student</button>
      </form>
    </section>

    <!-- Search & Filter Controls -->
    <section class="card controls">
      <div class="form-row">
        <input type="text" id="search-input" placeholder="🔍 Search by name..." />
        <input type="number" id="min-marks" placeholder="Filter: Min marks" min="0" max="100" />
        <button id="reset-btn" type="button">Reset</button>
      </div>
      <p class="student-count">
        Total Students: <span id="student-count">0</span>
      </p>
    </section>

    <!-- Student List -->
    <section class="card">
      <h2>Student List</h2>
      <table id="student-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Marks</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="student-list">
          <!-- Student rows are injected here by JavaScript -->
        </tbody>
      </table>
      <p id="no-results" class="hidden">No students found.</p>
    </section>
  </main>

  <footer>
    <p>Built for Day 2 — JavaScript Fundamentals (Arrays, Objects, Functions, DOM)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
